name: openhamclock
base: core22
version: '26.7.2'
summary: Modern Web-Based Amateur Radio Dashboard
description: |
  OpenHamClock is a free, real-time amateur radio dashboard with live DX cluster
  spots, PSK Reporter, Reverse Beacon Network, POTA/SOTA tracking, propagation
  predictions, solar indices, band conditions, satellite passes, and an
  interactive world map. Runs on any browser. No login, no ads, no subscription.

  In memory of Elwood Downey, WB0OEW.
  Original project: https://github.com/accius/openhamclock

grade: stable
confinement: strict
license: MIT

architectures:
  - build-on: amd64
  - build-on: arm64
  - build-on: armhf

apps:
  openhamclock:
    command: bin/openhamclock-launcher
    desktop: snap/gui/openhamclock.desktop
    plugs:
      - network
      - network-bind
      - home
      - desktop
      - desktop-legacy
      - x11
      - wayland
      - browser-support

  daemon:
    command: bin/openhamclock-launcher
    daemon: simple
    restart-condition: always
    plugs:
      - network
      - network-bind
      - home

parts:
  node:
    plugin: nil
    stage-packages:
      - nodejs
      - npm
      - curl
      - ca-certificates

  openhamclock:
    after: [node]
    plugin: nil
    source: .
    source-type: local
    override-build: |
      export PATH="$SNAPCRAFT_STAGE/usr/bin:$PATH"

      # Install all dependencies needed for the build
      npm ci --no-audit --no-fund || npm install --no-audit --no-fund

      # Fetch WASM module and build Vite frontend into dist/
      npm run build

      # Prune devDependencies to keep package size minimal
      npm prune --omit=dev --no-audit --no-fund

      # Install application tree to /usr/lib/openhamclock
      mkdir -p "$SNAPCRAFT_PART_INSTALL/usr/lib/openhamclock"
      cp -a dist "$SNAPCRAFT_PART_INSTALL/usr/lib/openhamclock/"
      cp -a public "$SNAPCRAFT_PART_INSTALL/usr/lib/openhamclock/"
      cp -a server "$SNAPCRAFT_PART_INSTALL/usr/lib/openhamclock/"
      mkdir -p "$SNAPCRAFT_PART_INSTALL/usr/lib/openhamclock/src"
      cp -a src/server "$SNAPCRAFT_PART_INSTALL/usr/lib/openhamclock/src/"
      cp -a node_modules "$SNAPCRAFT_PART_INSTALL/usr/lib/openhamclock/"
      cp package.json server.js "$SNAPCRAFT_PART_INSTALL/usr/lib/openhamclock/"
      [ -f config.example.json ] && cp config.example.json "$SNAPCRAFT_PART_INSTALL/usr/lib/openhamclock/"
      [ -f .env.example ] && cp .env.example "$SNAPCRAFT_PART_INSTALL/usr/lib/openhamclock/"
      touch "$SNAPCRAFT_PART_INSTALL/usr/lib/openhamclock/.env"

      # Install launcher
      mkdir -p "$SNAPCRAFT_PART_INSTALL/bin"
      cp snap/local/openhamclock-launcher "$SNAPCRAFT_PART_INSTALL/bin/"
      chmod +x "$SNAPCRAFT_PART_INSTALL/bin/openhamclock-launcher"
